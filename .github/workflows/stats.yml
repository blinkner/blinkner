name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: blinkner
          output: profile/stats.svg
          theme: dark
          hide_border: true
          show_icons: true
          include_all_commits: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: blinkner
          type: top-langs
          output: profile/top-langs.svg
          theme: dark
          hide_border: true
          layout: compact
          langs_count: 8

      - name: Generate Streak
        uses: stats-organization/github-readme-stats-action@v1
        with:
          username: blinkner
          type: streak
          output: profile/streak.svg
          theme: dark
          hide_border: true

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi

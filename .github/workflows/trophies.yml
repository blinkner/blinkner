name: Generate GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy@master
        with:
          github_user_name: blinkner
          output: profile/trophy.svg
          theme: darkhub
          no_frame: true
          no_bg: true
          margin_w: 8
          row: 1

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub trophies"
            git push
          fi
